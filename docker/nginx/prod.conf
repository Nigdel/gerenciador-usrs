# Nginx de producción.
#
# El de desarrollo (docker/nginx/default.conf) no se toca: los dos perfiles
# comparten la imagen pero no la configuración, y mezclar los ajustes de uno con
# los del otro es la forma más rápida de desplegar algo que funciona en local y
# falla en producción.

server {
    listen 80;
    server_name _;

    # Resolutor de Docker. Sin él, `fastcgi_pass app:9000` se resuelve una sola
    # vez al arrancar nginx, y el nombre queda clavado a la IP de entonces: si el
    # contenedor de app se recrea con otra IP —que es lo que pasa en cada
    # `up --build`—, nginx seguiría hablando a una IP que ya no existe y el 502
    # aparecería sin que nada más hubiera cambiado.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Tope de subida. El valor por defecto de nginx (1 MB) es pequeño para una
    # importación masiva de usuarios, y el error que devuelve sin esto es un 413
    # genérico que no dice nada de cuál era el límite.
    client_max_body_size 50M;

    root /var/www/public;
    index index.php;

    # Cabeceras de seguridad. Se emiten aquí y no en PHP para que apliquen
    # también a los recursos estáticos, que no pasan por el intérprete.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # El proxy de delante termina TLS, así que nginx ve HTTP. Sin estas dos
    # cabeceras, Laravel creería que la petición llegó en claro: se generaría
    # `session.cookie_secure` sobre una URL http:// y los enlaces absolutos
    # saldrían apuntando al puerto equivocado.
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Sustituye a /up y a /healthz de la aplicación por una respuesta local.
    # El healthcheck tiene que poder responder aunque PHP esté caído; si depende
    # de PHP, un contenedor con php-fpm en loop no se puede reiniciar nunca.
    location = /healthz {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"nginx ok"}';
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;

        set $php_backend app:9000;
        fastcgi_pass $php_backend;
        fastcgi_index index.php;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Tiempos altos porque dar de alta un usuario encadena varias llamadas
        # a subsistemas externos; con los 60 s de FastCGI por defecto, una
        # integración lenta se manifestaría como un 502 que no dice de quién es
        # la culpa.
        fastcgi_read_timeout 120s;
        fastcgi_send_timeout 120s;
        fastcgi_connect_timeout 10s;

        # Vacía HTTP_PROXY para que getUserStatus() no intente salir por un
        # proxy heredado del entorno; los drivers llaman a la red interna.
        fastcgi_param HTTP_PROXY "";
    }

    # Deniega el acceso a ficheros ocultos (.env, .git, etc.) y a los que
    # aparecen en el árbol pero no deberían servirse.
    location ~ /\. {
        deny all;
    }

    location ~* \.(css|js|mjs|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}