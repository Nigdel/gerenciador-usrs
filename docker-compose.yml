services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: gerenciador-usrs-app
    working_dir: /var/www
    extra_hosts:
      - "dc1.klios.br:10.1.2.2"
    # El chmod de storage y bootstrap/cache es el equivalente en desarrollo de
    # lo que hace docker/php/Dockerfile.prod:124. Aquí va con chmod y no con el
    # chown de producción porque el código se monta por volumen desde el NTFS del
    # host (9p/drvfs), donde Docker no puede representar la propiedad: todo
    # aparece como root:root y solo cuentan los bits de modo.
    #
    # Sin esto, storage/ se queda como la deja el checkout —con el directorio de
    # logs en 777 pero cualquier fichero en 644 root— y el primer artisan que se
    # ejecuta, que corre como root porque el Dockerfile no declara USER, crea
    # storage/logs/laravel.log en 644 root. Los workers de php-fpm corren como
    # www-data y se quedan sin poder escribirlo, que es lo que vuelve cada error
    # con un UnexpectedValueException sobre el log que no se pudo abrir.
    command: sh -c "mkdir -p /tmp/laravel-views storage/logs bootstrap/cache && chmod -R ug+rwX storage bootstrap/cache && chown -R www-data:www-data /tmp/laravel-views && exec php-fpm"
    volumes:
      - ./src:/var/www
    networks:
      - gerenciador-usrs
    restart: unless-stopped

  assets:
    image: node:22-alpine
    working_dir: /var/www
    command: sh -c "npm ci --no-audit --no-fund && npm run build"
    volumes:
      - ./src:/var/www
    networks:
      - gerenciador-usrs

  # Ejecuta las tareas programadas (Fase 2.2: reactivación automática).
  # schedule:work se queda en primer plano; en producción se usaría
  # `schedule:run` con cron.
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: gerenciador-usrs-scheduler
    working_dir: /var/www
    extra_hosts:
      - "dc1.klios.br:10.1.2.2"
    # Mismo chmod que en el servicio app: los tres comparten el árbol montado, y
    # el orden de arranque no está garantizado, así que cada uno lo hace en vez
    # de fiarse de que otro ya lo hizo.
    command: sh -c "mkdir -p storage/logs bootstrap/cache && chmod -R ug+rwX storage bootstrap/cache && exec php artisan schedule:work"
    volumes:
      - ./src:/var/www
    networks:
      - gerenciador-usrs
    # Sin esto, la reactivación automática y `operations:expire-stuck` se
    # quedan sin ejecutar en silencio: nadie ve que un calendario parado es
    # indistinguible de uno que no tiene nada que hacer.
    restart: unless-stopped

  # Worker de la cola (Fase 3.2): procesa el alta, suspensión, baja,
  # reactivación y sincronización que salen a los subsistemas.
  #
  # --tries=3 es el respaldo por si algún job se despacha sin su propio $tries.
  # --queue=subsistemas primero porque es donde va el trabajo lento con
  # llamadas salientes; 'default' detrás para que no quede sin procesar nada de
  # lo que se encole más adelante.
  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: gerenciador-usrs-queue
    working_dir: /var/www
    extra_hosts:
      - "dc1.klios.br:10.1.2.2"
    command: sh -c "mkdir -p storage/logs bootstrap/cache && chmod -R ug+rwX storage bootstrap/cache && exec php artisan queue:work --queue=subsistemas,default --tries=3 --verbose"
    volumes:
      - ./src:/var/www
    networks:
      - gerenciador-usrs
    # Sin esto, un `queue:restart` deja el worker parado para siempre: la orden
    # no mata el proceso, solo le avisa de que se reinicie al terminar el job,
    # y sin política que lo levante se queda sin nadie que ejecute las
    # operaciones. La web seguiría aceptando altas, así que el fallo no se ve.
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: gerenciador-usrs-nginx
    ports:
      - "8085:80"
    volumes:
      - ./src:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      app:
        condition: service_started
      assets:
        condition: service_completed_successfully
    networks:
      - gerenciador-usrs
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: gerenciador-usrs-mysql
    environment:
      MYSQL_DATABASE: gerenciador
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - gerenciador-usrs
    # MySQL es el único sitio donde vive todo: cola, caché y sesiones. Si cae
    # y no vuelve, la web responde 500 y el worker pierde los jobs pendientes.
    restart: unless-stopped

  # Redis se retiró en el Sprint 2.3: cola, caché y sesión van a `database`, así
  # que el contenedor no lo usaba nadie y soloocupaba memoria. Si algún día hace
  # falta (un caché compartido entre contenedores, locks de cola), hay que
  # volver a añadirlo *y* instalar la extensión phpredis en docker/php/Dockerfile,
  # que hoy no está. Sin las dos cosas, `REDIS_HOST=redis` falla en runtime.

networks:
  gerenciador-usrs:
    driver: bridge

volumes:
  mysql_data:
