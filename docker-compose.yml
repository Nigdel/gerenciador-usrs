services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: gerenciador-usrs-app
    working_dir: /var/www
    command: sh -c "mkdir -p /tmp/laravel-views && chown -R www-data:www-data /tmp/laravel-views && exec php-fpm"
    volumes:
      - ./src:/var/www
    networks:
      - gerenciador-usrs

  assets:
    image: node:22-alpine
    working_dir: /var/www
    command: sh -c "npm install --no-audit --no-fund && npm run build"
    volumes:
      - ./src:/var/www
    networks:
      - gerenciador-usrs

  nginx:
    image: nginx:alpine
    container_name: gerenciador-usrs-nginx
    ports:
      - "8085:80"
    volumes:
      - ./src:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      app:
        condition: service_started
      assets:
        condition: service_completed_successfully
    networks:
      - gerenciador-usrs

  mysql:
    image: mysql:8.4
    container_name: gerenciador-usrs-mysql
    environment:
      MYSQL_DATABASE: gerenciador
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - gerenciador-usrs

  redis:
    image: redis:alpine
    container_name: gerenciador-usrs-redis
    volumes:
      - redis_data:/data
    networks:
      - gerenciador-usrs

networks:
  gerenciador-usrs:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
